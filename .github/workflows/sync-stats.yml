name: Daily Stats Rebuild

on:
  schedule:
    # Läuft jeden Tag um 03:00 Uhr UTC (05:00 Uhr MESZ)
    - cron: '0 3 * * *'
  workflow_dispatch: # Ermöglicht auch manuelles Triggern per Klick im GitHub-UI

jobs:
  trigger-vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
